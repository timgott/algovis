<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Graph to UI</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./style.layoutdemo.css">
</head>
<body>
    <div class="fullscreen flex">
        <div class="vflex resizable">
            <div class="top_bar control_bar">
                <button id="tool_build">Build</button>
                <button id="tool_select">Select</button>
                <button id="tool_drag">Drag</button>
                <button id="tool_move">Move</button>
                <button id="tool_shift">Shift</button>
                <button id="tool_delete">Delete</button>
                <button id="btn_reset">Reset</button>
                <button id="btn_undo">Undo</button>
                <button id="btn_show">Preview</button>
                <button id="btn_redo">Redo</button>
                <button id="btn_save">Save in URL</button>
            </div>
            <div id="main_canvas_container" class="flex_fill">
                <canvas id="canvas" class="main_canvas"></canvas>
            </div>
            <div class="bottom_bar control_bar">
                <input type="text" id="input_label"></input>
                <button id="btn_op_box">box</button>
            </div>
        </div>
        <div class="vline"></div>
        <div class="preview_pane" class="flex_fill vflex">
            <div class="top_bar control_bar preview_header">
                Preview
            </div>
            <div id="preview" class="preview_content">
            </div>
        </div>
    </div>

    <script type="module" src="src/layoutdemo/main.layoutdemo.ts"></script>
</body>
</html>
